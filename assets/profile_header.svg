<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320"
  viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Kaito Shigyo</title>
  <desc id="description">Software Engineering and AI Coding Agents</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1117" />
      <stop offset="1" stop-color="#171b25" />
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="48%" r="48%">
      <stop offset="0" stop-color="#4af2c8" stop-opacity="0.16" />
      <stop offset="1" stop-color="#4af2c8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#4af2c8" stroke-opacity="0.055" />
    </pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#background)" />
  <rect width="1200" height="320" rx="18" fill="url(#grid)" />
  <rect width="1200" height="320" rx="18" fill="url(#glow)" />
  <path d="M0 319.5H1200" stroke="#4af2c8" stroke-opacity="0.55" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="72" y="116" fill="#4af2c8" font-size="16" font-weight="700" letter-spacing="4">HELLO, I'M</text>
    <text x="68" y="179" fill="#f4f4f5" font-size="54" font-weight="750" letter-spacing="1">KAITO SHIGYO</text>
    <text x="72" y="222" fill="#a1a1aa" font-size="20"
      letter-spacing="1.6">SOFTWARE ENGINEERING · AI CODING AGENTS</text>
  </g>

  <g transform="translate(812 65)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="318" height="190" rx="12" fill="#0b0d12" stroke="#2a2d37" />
    <circle cx="22" cy="20" r="4" fill="#ff6b6b" />
    <circle cx="38" cy="20" r="4" fill="#ffd166" />
    <circle cx="54" cy="20" r="4" fill="#4af2c8" />
    <path d="M0 38H318" stroke="#2a2d37" />
    <text x="22" y="72" fill="#4af2c8" font-size="13">$ evaluate-agent \</text>
    <text x="38" y="96" fill="#a1a1aa" font-size="13">--context project-guidelines</text>
    <text x="22" y="132" fill="#e4e4e7" font-size="13">evidence &gt; impressions</text>
    <text x="22" y="161" fill="#4af2c8" font-size="13" filter="url(#soft-glow)">● reproducible</text>
  </g>

  <g fill="#4af2c8">
    <circle cx="768" cy="91" r="3" />
    <circle cx="744" cy="158" r="3" />
    <circle cx="778" cy="230" r="3" />
  </g>
  <g stroke="#4af2c8" stroke-opacity="0.32">
    <path d="M768 91L812 110" />
    <path d="M744 158L812 158" />
    <path d="M778 230L812 208" />
  </g>
</svg>
